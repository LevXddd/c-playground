name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Build (warnings are errors)
        run: make CC=${{ matrix.cc }} CFLAGS="-std=c2x -Wall -Wextra -Werror -g"

      - name: Build with AddressSanitizer + UBSan
        run: make CC=${{ matrix.cc }} asan

      - name: Static analysis
        if: matrix.cc == 'gcc'
        run: make lint

      - name: Hardening report
        if: matrix.cc == 'gcc'
        run: make hardening
